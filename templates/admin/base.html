<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}لوحة التحكم{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
{% if session.admin_id %}
<header class="admin-nav">
  <div class="admin-nav-inner">
    <span class="brand">إدارة الاستبيان</span>
    <nav class="admin-nav-links" aria-label="التنقل الرئيسي">
      <a href="{{ url_for('admin_dashboard') }}">الرئيسية</a>
      <a href="{{ url_for('admin_responses') }}">الإجابات</a>
      <a href="{{ url_for('admin_features') }}">الميزات</a>
      <a href="{{ url_for('admin_survey_settings') }}">إعدادات</a>
      <a href="{{ url_for('survey') }}" target="_blank" rel="noopener">معاينة</a>
      <a href="{{ url_for('admin_logout') }}" class="nav-logout">خروج</a>
    </nav>
  </div>
</header>
{% endif %}
<div class="{% if session.admin_id %}container{% else %}login-wrap{% endif %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
